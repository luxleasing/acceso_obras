<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXVision | Visor de tramo</title>

  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">LUXVISION · MAPEO MÓVIL</div>
      <h1>Acceso Este · Sección 1</h1>
    </div>
    <div class="status"><span></span> VISOR DE TRAMO</div>
  </header>

  <main id="workspace">
    <section id="map-stage">
      <div id="map"></div>

      <div class="map-badge">
        <span class="line-sample"></span>
        <span>Tramo relevado</span>
        <span class="point-sample"></span>
        <span>Fotogramas 360°</span>
      </div>

      <button id="basemap-toggle" type="button">
        <span id="bm-label">Mapa</span>
      </button>
    </section>

    <div id="resizer" title="Arrastrar para cambiar el ancho"></div>

    <aside id="sidebar">
      <section class="viewer-card">
        <div class="card-head">
          <div>
            <span class="card-kicker">REFERENCIA</span>
            <h2>Google Street View</h2>
          </div>
          <a id="btn-sv-external" href="#" target="_blank" rel="noopener">Abrir ↗</a>
        </div>
        <div class="media-frame street-frame">
          <iframe id="streetview-player" src="about:blank" allowfullscreen loading="lazy"></iframe>
          <div class="empty-state" id="street-placeholder">
            Seleccioná un fotograma en el mapa
          </div>
        </div>
      </section>

      <section class="viewer-card viewer-card-360">
        <div class="card-head">
          <div>
            <span class="card-kicker">RELEVAMIENTO</span>
            <h2>Mapeo móvil 360°</h2>
          </div>
          <span id="frame-meta">Sin selección</span>
        </div>
        <div class="media-frame pano-frame">
          <div id="panorama-viewer"></div>
          <div class="empty-state" id="frame-placeholder">
            Seleccioná un punto para visualizar el fotograma 360°
          </div>
        </div>
      </section>
    </aside>
  </main>

<script>
/*
  VISOR SIMPLE DE UN SOLO TRAMO
  Para cambiar de tramo, normalmente alcanza con editar estas cuatro líneas.
*/
const CONFIG = {
  rutaGeojson: './RN_7_acceso_DPV_4326.geojson',
  seccion: 'Seccion 1',
  puntosGeojson: './TRAMO_000891_001132/tramo_1.geojson',
  frames: './TRAMO_000891_001132/frames/'
};

let pannellumViewer = null;
let activePopup = null;
let selectedImage = '';
let currentBasemap = 'sat';

function norm(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function fmtDT(v) {
  if (!v) return '';
  try {
    let d;
    if (typeof v === 'string' && v.includes('/')) {
      const p = v.split(/[/\s:]+/);
      d = new Date(+p[2], +p[1]-1, +p[0], +(p[3]||0), +(p[4]||0), +(p[5]||0));
    } else {
      d = new Date(v);
    }
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('es-AR', {
      day:'2-digit', month:'2-digit', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  } catch(e) {
    return String(v);
  }
}

function buildImagePath(imageProp) {
  let base = (CONFIG.frames || '').replace(/\\/g, '/');
  let img = (imageProp || '').replace(/\\/g, '/');

  if (base && !base.endsWith('/')) base += '/';

  const baseParts = base.split('/').filter(Boolean);
  const imgParts = img.split('/').filter(Boolean);

  if (baseParts.length && imgParts.length &&
      baseParts[baseParts.length - 1] === imgParts[0]) {
    img = imgParts.slice(1).join('/');
  }
  return base + img;
}

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap contributors'
      },
      sat: {
        type: 'raster',
        tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
        tileSize: 256,
        attribution: '© Google'
      }
    },
    layers: [
      { id:'osm-layer', type:'raster', source:'osm', layout:{visibility:'none'} },
      { id:'sat-layer', type:'raster', source:'sat', layout:{visibility:'visible'} }
    ]
  },
  center: [-68.735, -32.899],
  zoom: 13
});

map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');

document.getElementById('basemap-toggle').addEventListener('click', () => {
  currentBasemap = currentBasemap === 'sat' ? 'osm' : 'sat';
  map.setLayoutProperty('sat-layer', 'visibility', currentBasemap === 'sat' ? 'visible' : 'none');
  map.setLayoutProperty('osm-layer', 'visibility', currentBasemap === 'osm' ? 'visible' : 'none');
  document.getElementById('bm-label').textContent = currentBasemap === 'sat' ? 'Mapa' : 'Satélite';
});

function loadStreetView(lng, lat) {
  document.getElementById('street-placeholder').style.display = 'none';
  document.getElementById('streetview-player').src =
    `https://maps.google.com/maps?q=&layer=c&cbll=${lat},${lng}&cbp=11,0,0,0,0&output=svembed`;
  document.getElementById('btn-sv-external').href =
    `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
}

function load360(props) {
  const imagePath = buildImagePath(props.imagen);
  const fecha = props.hora_gpx || props.fecha || '';

  document.getElementById('frame-placeholder').style.display = 'none';
  document.getElementById('frame-meta').textContent =
    [props.imagen, fmtDT(fecha)].filter(Boolean).join(' · ');

  if (pannellumViewer) {
    try { pannellumViewer.destroy(); } catch(e) {}
  }

  pannellumViewer = pannellum.viewer('panorama-viewer', {
    type: 'equirectangular',
    panorama: imagePath,
    autoLoad: true,
    showControls: true,
    compass: false
  });
}

function fitToData(route, points) {
  const bounds = new maplibregl.LngLatBounds();
  let has = false;

  function addCoords(coords) {
    if (!Array.isArray(coords)) return;
    if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
      bounds.extend(coords);
      has = true;
      return;
    }
    coords.forEach(addCoords);
  }

  (route.features || []).forEach(f => addCoords(f.geometry && f.geometry.coordinates));
  (points.features || []).forEach(f => addCoords(f.geometry && f.geometry.coordinates));

  if (has && !bounds.isEmpty()) {
    map.fitBounds(bounds, {padding: 55, maxZoom: 17});
  }
}

map.on('load', async () => {
  let route = {type:'FeatureCollection', features:[]};
  let points = {type:'FeatureCollection', features:[]};

  try {
    const r = await fetch(CONFIG.rutaGeojson);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const allRoute = await r.json();

    route = {
      type: 'FeatureCollection',
      features: (allRoute.features || []).filter(f => {
        if (!CONFIG.seccion) return true;
        const sec = f.properties ? f.properties['1_seccion'] : '';
        return norm(sec) === norm(CONFIG.seccion);
      })
    };
  } catch(e) {
    console.warn('No se pudo cargar el vector del tramo:', e);
  }

  try {
    const r = await fetch(CONFIG.puntosGeojson);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();

    // Solo conserva puntos que tienen un nombre de imagen.
    points = {
      type: 'FeatureCollection',
      features: (raw.features || []).filter(f =>
        f.geometry && f.geometry.type === 'Point' &&
        f.properties && f.properties.imagen &&
        String(f.properties.imagen).trim() !== ''
      )
    };
  } catch(e) {
    console.warn('No se pudieron cargar los puntos:', e);
  }

  map.addSource('route-src', {type:'geojson', data:route});
  map.addLayer({
    id:'route-shadow',
    type:'line',
    source:'route-src',
    paint:{
      'line-color':'#20282d',
      'line-width':7,
      'line-opacity':0.65
    }
  });
  map.addLayer({
    id:'route-line',
    type:'line',
    source:'route-src',
    paint:{
      'line-color':'#8297a3',
      'line-width':4,
      'line-opacity':0.95
    }
  });

  map.addSource('frames-src', {type:'geojson', data:points});
  map.addLayer({
    id:'frames-halo',
    type:'circle',
    source:'frames-src',
    paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],10,5,15,10,18,14],
      'circle-color':'#9eabb2',
      'circle-opacity':0.16
    }
  });
  map.addLayer({
    id:'frames-points',
    type:'circle',
    source:'frames-src',
    paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],10,2.5,14,4.5,18,7],
      'circle-color':'#aab7bd',
      'circle-stroke-width':1.2,
      'circle-stroke-color':'#354047'
    }
  });
  map.addLayer({
    id:'frame-selected',
    type:'circle',
    source:'frames-src',
    filter:['==', ['get','imagen'], ''],
    paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],10,6,14,9,18,13],
      'circle-color':'rgba(0,0,0,0)',
      'circle-stroke-width':2.5,
      'circle-stroke-color':'#d2c59d'
    }
  });

  map.on('click', 'frames-points', e => {
    const f = e.features[0];
    const props = f.properties || {};
    const coords = f.geometry.coordinates.slice();

    selectedImage = props.imagen || '';
    map.setFilter('frame-selected', ['==', ['get','imagen'], selectedImage]);

    if (activePopup) activePopup.remove();
    activePopup = new maplibregl.Popup({closeButton:false, offset:10})
      .setLngLat(coords)
      .setHTML(`<strong>Fotograma</strong><br>${selectedImage}`)
      .addTo(map);

    loadStreetView(coords[0], coords[1]);
    load360(props);
  });

  map.on('mouseenter', 'frames-points', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'frames-points', () => map.getCanvas().style.cursor = '');

  fitToData(route, points);
});

// Panel lateral redimensionable
const resizer = document.getElementById('resizer');
const sidebar = document.getElementById('sidebar');
let resizing = false;

resizer.addEventListener('mousedown', () => {
  resizing = true;
  document.body.classList.add('resizing');
});

window.addEventListener('mousemove', e => {
  if (!resizing) return;
  const width = Math.max(330, Math.min(window.innerWidth * 0.68, window.innerWidth - e.clientX));
  sidebar.style.width = width + 'px';
  map.resize();
  if (pannellumViewer && pannellumViewer.resize) pannellumViewer.resize();
});

window.addEventListener('mouseup', () => {
  resizing = false;
  document.body.classList.remove('resizing');
});

window.addEventListener('resize', () => {
  map.resize();
  if (pannellumViewer && pannellumViewer.resize) pannellumViewer.resize();
});
</script>
</body>
</html>
